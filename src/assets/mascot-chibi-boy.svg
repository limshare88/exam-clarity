<svg viewBox="0 0 768 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="boyHair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b2a20"/>
      <stop offset="100%" stop-color="#241a13"/>
    </linearGradient>
    <linearGradient id="boySkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe0c2"/>
      <stop offset="100%" stop-color="#ffd0a6"/>
    </linearGradient>
    <linearGradient id="boyShirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6fb7e8"/>
      <stop offset="100%" stop-color="#4f9bd6"/>
    </linearGradient>
    <linearGradient id="boyShorts" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b4a63"/>
      <stop offset="100%" stop-color="#2c384c"/>
    </linearGradient>
    <radialGradient id="boyCheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9d9d" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ff9d9d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="384" cy="980" rx="150" ry="24" fill="#000" opacity="0.08"/>

  <!-- legs -->
  <rect x="320" y="760" width="46" height="150" rx="20" fill="#ffd0a6"/>
  <rect x="402" y="760" width="46" height="150" rx="20" fill="#ffd0a6"/>
  <!-- shoes -->
  <rect x="308" y="895" width="70" height="38" rx="16" fill="#e8574a"/>
  <rect x="390" y="895" width="70" height="38" rx="16" fill="#e8574a"/>

  <!-- shorts -->
  <path d="M300 640 Q384 615 468 640 L472 780 Q420 800 384 785 Q348 800 296 780 Z" fill="url(#boyShorts)"/>

  <!-- arms -->
  <path d="M280 560 Q225 610 232 700 Q234 725 258 726 Q280 725 280 700 Q272 630 312 590 Z" fill="url(#boyShirt)"/>
  <path d="M488 560 Q543 610 536 700 Q534 725 510 726 Q488 725 488 700 Q496 630 456 590 Z" fill="url(#boyShirt)"/>
  <circle cx="256" cy="712" r="24" fill="#ffd0a6"/>
  <circle cx="512" cy="712" r="24" fill="#ffd0a6"/>

  <!-- torso / t-shirt -->
  <path d="M290 470 Q384 440 478 470 Q500 560 468 650 Q384 685 300 650 Q268 560 290 470 Z" fill="url(#boyShirt)"/>
  <path d="M356 468 Q384 500 412 468 L412 490 Q384 512 356 490 Z" fill="#ffffff" opacity="0.55"/>

  <!-- neck -->
  <rect x="356" y="430" width="56" height="50" rx="18" fill="url(#boySkin)"/>

  <!-- head -->
  <circle cx="384" cy="330" r="150" fill="url(#boySkin)"/>

  <!-- ears -->
  <circle cx="234" cy="335" r="26" fill="#ffd0a6"/>
  <circle cx="534" cy="335" r="26" fill="#ffd0a6"/>

  <!-- cheeks -->
  <ellipse cx="304" cy="378" rx="34" ry="22" fill="url(#boyCheek)"/>
  <ellipse cx="464" cy="378" rx="34" ry="22" fill="url(#boyCheek)"/>

  <!-- eyes (large, expressive) -->
  <g>
    <ellipse cx="326" cy="340" rx="34" ry="42" fill="#2b2320"/>
    <ellipse cx="326" cy="328" rx="13" ry="16" fill="#ffffff"/>
    <circle cx="316" cy="356" r="7" fill="#ffffff" opacity="0.85"/>
  </g>
  <g>
    <ellipse cx="442" cy="340" rx="34" ry="42" fill="#2b2320"/>
    <ellipse cx="442" cy="328" rx="13" ry="16" fill="#ffffff"/>
    <circle cx="432" cy="356" r="7" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- eyebrows -->
  <path d="M296 288 Q326 272 356 288" stroke="#3b2a20" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M412 288 Q442 272 472 288" stroke="#3b2a20" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- nose + smile -->
  <path d="M384 358 q6 14 -4 22" stroke="#e8a97c" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M356 400 Q384 424 412 400" stroke="#b5583f" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- hair: short, slightly tousled, with shading strokes -->
  <path
    d="M214 320
       Q198 210 300 176
       Q330 158 384 160
       Q438 158 468 176
       Q570 210 554 320
       Q548 262 500 240
       Q512 274 498 300
       Q486 250 452 224
       Q460 256 444 278
       Q420 236 384 228
       Q348 236 324 278
       Q308 256 316 224
       Q282 250 270 300
       Q256 274 268 240
       Q220 262 214 320 Z"
    fill="url(#boyHair)"
  />
  <path d="M300 200 Q330 184 360 200" stroke="#4a3527" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M410 200 Q440 184 468 202" stroke="#4a3527" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.6"/>
</svg>
